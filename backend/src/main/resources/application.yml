spring:
  application:
    name: gamersden-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamersden}
    username: ${DB_USER:gamersden}
    password: ${DB_PASSWORD:gamersden}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Never go beyond validate (ARCHITECTURE.md §4.2).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Dhaka
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Backstop only. The rule an operator actually meets is gamersden.settings.login-bg.max-size
      # below, which answers with the VALIDATION_FAILED envelope; these cut off an upload that is
      # far past it before it can be buffered (B21).
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  writer-with-order-by-keys: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    dev.gamersden: INFO

gamersden:
  timezone: Asia/Dhaka
  sessions:
    # Persists the LOCKED flip on an idle floor; reads derive it either way (ARCHITECTURE.md §5.1).
    lock-sweeper-enabled: true
  currency: BDT
  # Print queue (B18). The transport is off by default — only the venue box owns a USB printer
  # (ARCHITECTURE.md §6); every other profile runs the fake port. The attempt count and the
  # backoff are the numbers docs/backend-architecture.md §5 fixes: 3 auto-attempts, 2 s apart.
  printing:
    enabled: false
    worker-enabled: true
    default-device: ""
    poll-interval: 1s
    max-attempts: 3
    retry-backoff: 2s
    usb-timeout: 5s
  # GET /events (B19). Neither number is load-bearing: the frontend reconnects on its own and
  # polls every 10 s as a fallback (ARCHITECTURE.md §4.5). The timeout ends a stream nobody is
  # reading; the heartbeat comment finds a dead one while the venue is quiet.
  events:
    timeout: 30m
    heartbeat: 20s
  # S13 terminal settings (B21). A login background is a photo behind a dark overlay, not a print
  # asset; anything past this is a mistake rather than a preference, and is refused with the
  # documented 400 envelope naming the limit.
  settings:
    login-bg:
      max-size: 2MB
  # OPEN FLAG (ARCHITECTURE.md §8): documented default until the venue confirms.
  morning-discount:
    from: "10:00"
    to: "14:00"
    percent: 25
  # Auth numbers are fixed by api-contract.md §1 — do not tune them per environment.
  auth:
    # DEV PLACEHOLDER. Set JWT_SECRET (>= 32 bytes) in every real deployment; the venue and cloud
    # profiles refuse to start while this default is in place (ARCHITECTURE.md §6).
    jwt-secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-before-any-real-deployment}
    access-ttl: 15m
    refresh-ttl: 12h
    max-pin-attempts: 5
    lock-duration: 15m
    refresh-cookie:
      name: gd_refresh
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Strict
