spring:
  application:
    name: gamersden-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamersden}
    username: ${DB_USER:gamersden}
    password: ${DB_PASSWORD:gamersden}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Never go beyond validate (ARCHITECTURE.md §4.2).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Dhaka
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  writer-with-order-by-keys: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    dev.gamersden: INFO

gamersden:
  timezone: Asia/Dhaka
  sessions:
    # Persists the LOCKED flip on an idle floor; reads derive it either way (ARCHITECTURE.md §5.1).
    lock-sweeper-enabled: true
  currency: BDT
  printing:
    # P1-P7 lay out to this width; 58 mm is the documented config switch and narrows the Code 128
    # module with it (design.md §5, OPEN FLAG on the printer model - ARCHITECTURE.md §8).
    receipt:
      paper-width: MM_80
      venue-name: "GAMER'S DEN"
      address: "Jaleshwaritola, Bogura"
      phone: "01711-000000"
  # OPEN FLAG (ARCHITECTURE.md §8): documented default until the venue confirms.
  morning-discount:
    from: "10:00"
    to: "14:00"
    percent: 25
  # Auth numbers are fixed by api-contract.md §1 — do not tune them per environment.
  auth:
    # DEV PLACEHOLDER. Set JWT_SECRET (>= 32 bytes) in every real deployment; the venue and cloud
    # profiles refuse to start while this default is in place (ARCHITECTURE.md §6).
    jwt-secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-before-any-real-deployment}
    access-ttl: 15m
    refresh-ttl: 12h
    max-pin-attempts: 5
    lock-duration: 15m
    refresh-cookie:
      name: gd_refresh
      path: /api/v1/auth
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Strict
